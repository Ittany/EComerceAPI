<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TecnoMarket Perú</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#17263b;font:16px system-ui}header{background:#102b49;color:white;padding:20px 5%;display:flex;align-items:center;gap:24px;flex-wrap:wrap}header a{color:white}header strong{font-size:25px;margin-right:auto}button{background:#1264a3;color:white;border:0;border-radius:7px;padding:11px 16px;cursor:pointer}button:disabled{opacity:.5}main{max-width:1250px;margin:auto;padding:24px}.hero{background:linear-gradient(110deg,#102b49,#1476b5);color:white;padding:40px;border-radius:15px;margin-bottom:24px}.hero h1{font-size:36px;margin:0}input,select,textarea{padding:10px;border:1px solid #cbd5e1;border-radius:6px;max-width:100%}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px}.card,section{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 8px #102b4910}.card img{width:100%;height:140px;object-fit:contain;background:#eaf2fa;border-radius:8px}.price{font-size:24px;font-weight:bold;color:#1264a3}small{color:#52647a}#msg{white-space:pre-wrap;color:#9b341b}dialog{border:0;border-radius:12px;max-width:90vw;width:650px}dialog::backdrop{background:#102b4977}a{color:#1264a3}footer{padding:30px;text-align:center;color:#52647a}</style></head><body><header><strong>TecnoMarket Perú</strong><button onclick="catalogo()">Catálogo</button><button onclick="carrito()">Carrito</button><button onclick="ordenes()">Mis pedidos</button><button onclick="login()" id="account">Iniciar sesión</button><a href="/api/docs/">Swagger</a><a href="/api/redoc/">ReDoc</a><a href="/admin/">Administración</a></header><main><div class="hero"><small style="color:#cceaff">TECNOLOGÍA PARA TODOS</small><h1>Encuentra tu próxima tecnología</h1><p>Laptops, smartphones, componentes y accesorios.</p></div><p id="msg" role="status"></p><div id="content"></div></main><dialog id="modal"></dialog><footer>TecnoMarket Perú · Plataforma de demostración académica</footer><script>
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token=sessionStorage.getItem('token')||'', user=sessionStorage.getItem('user')||'';function account(){$('account').textContent=user?user+' · Salir':'Iniciar sesión'}account();async function api(url,data,method){let r=await fetch(url,{method:method||(data?'POST':'GET'),headers:{'Content-Type':'application/json',...(token?{Authorization:'Token '+token}:{})},...(data?{body:JSON.stringify(data)}:{})});let j=await r.json().catch(()=>null);if(!r.ok)throw Error(JSON.stringify(j));return j}function run(f){return async(...a)=>{try{$('msg').textContent='';await f(...a)}catch(e){$('msg').textContent=e.message}}}function show(h){$('content').innerHTML=h}function dialog(h){$('modal').innerHTML=h+'<p><button onclick="document.getElementById(\'modal\').close()">Cerrar</button></p>';$('modal').showModal()}function login(){if(token){sessionStorage.clear();token=user='';account();catalogo();return}dialog('<h2>Iniciar sesión</h2><form id="lf"><p><input name="username" placeholder="Usuario" required></p><p><input name="password" type="password" placeholder="Contraseña" required></p><button>Ingresar</button><p id="err"></p></form>');$('lf').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target)),j=await api('/api/token/',d);token=j.token;user=d.username;sessionStorage.setItem('token',token);sessionStorage.setItem('user',user);account();$('modal').close();catalogo()}catch(e){$('err').textContent=e.message}}}
let filters='',page=1;const catalogo=run(async(p=1)=>{page=p;let j=await api('/api/productos/?page='+p+'&'+filters);show(`<h2>Catálogo de productos</h2><form class="bar" id="filters"><input name="search" placeholder="Buscar productos"><select name="categoria"><option value="">Todas las categorías</option>${['laptops','smartphones','componentes','accesorios'].map(x=>`<option>${x}</option>`).join('')}</select><input name="marca" placeholder="Marca"><input name="precio_min" type="number" placeholder="Precio mínimo"><input name="precio_max" type="number" placeholder="Precio máximo"><select name="ordering"><option value="">Orden predeterminado</option><option value="precio">Menor precio</option><option value="-precio">Mayor precio</option></select><button>Filtrar</button></form><p>${j.count} productos</p><div class="grid">${j.results.map(x=>`<article class="card"><img src="/static/${esc(x.categoria_detalle.nombre)}.svg" alt="Ilustración de categoría"><small>${esc(x.marca)} · ${esc(x.sku)}</small><h3>${esc(x.nombre)}</h3><p class="price">S/ ${Number(x.precio_con_descuento).toFixed(2)}</p><p>Stock: ${x.stock} · Rating: ${Number(x.rating_promedio).toFixed(1)}/5</p><button onclick="detalle(${x.id})">Ver detalle</button> <button ${x.stock?'':'disabled'} onclick="agregar(${x.id})">Agregar</button></article>`).join('')}</div><div class="bar"><button ${j.previous?'':'disabled'} onclick="catalogo(${p-1})">Anterior</button><span>Página ${p}</span><button ${j.next?'':'disabled'} onclick="catalogo(${p+1})">Siguiente</button></div>`);for(let [k,v] of new URLSearchParams(filters))if($('filters').elements[k])$('filters').elements[k].value=v;$('filters').onsubmit=e=>{e.preventDefault();filters=new URLSearchParams([...new FormData(e.target)].filter(x=>x[1])).toString();catalogo()}});
const detalle=run(async id=>{let x=await api('/api/productos/'+id+'/'),r=await api('/api/productos/'+id+'/reseñas/');dialog(`<h2>${esc(x.nombre)}</h2><p>${esc(x.descripcion||'Producto tecnológico')}</p><p>S/ ${Number(x.precio_con_descuento).toFixed(2)} · Stock ${x.stock}</p><pre>${esc(JSON.stringify(x.especificaciones,null,2))}</pre><h3>Reseñas</h3>${r.map(y=>`<p>${y.calificacion}/5 · ${esc(y.titulo)} — ${esc(y.comentario)}</p>`).join('')}<form id="review"><input name="titulo" placeholder="Título" required><input name="calificacion" type="number" min="1" max="5" required><textarea name="comentario" required placeholder="Comentario"></textarea><button>Publicar reseña</button><p id="reviewerr"></p></form>`);$('review').onsubmit=async e=>{e.preventDefault();try{await api('/api/reseñas/',{...Object.fromEntries(new FormData(e.target)),producto:id});$('modal').close();detalle(id)}catch(e){$('reviewerr').textContent=e.message}}});const agregar=run(async id=>{if(!token)return login();await api('/api/carrito/agregar/',{producto:id,cantidad:1});$('msg').textContent='Producto agregado al carrito'});const carrito=run(async()=>{if(!token)return login();let j=await api('/api/carrito/');let rows=await Promise.all(j.items.map(async i=>({...i,nombre:(await api('/api/productos/'+i.producto+'/')).nombre})));show(`<section><h2>Mi carrito</h2>${rows.map(i=>`<p>${esc(i.nombre)} · S/ ${esc(i.precio)} <input type="number" min="1" value="${i.cantidad}" id="q${i.producto}" style="width:80px"><button onclick="cambiar(${i.producto})">Actualizar</button> <button onclick="eliminar(${i.producto})">Eliminar</button></p>`).join('')}<p>Subtotal: S/ ${Number(j.subtotal).toFixed(2)} · IGV: S/ ${Number(j.impuestos).toFixed(2)}</p><h3>Total: S/ ${Number(j.total).toFixed(2)}</h3><button onclick="vaciar()">Vaciar carrito</button><h3>Finalizar compra de demostración</h3><form id="checkout"><input name="direccion_envio" placeholder="Dirección ficticia de envío" required><select name="metodo_pago"><option value="simulado">Pago simulado</option></select><button ${rows.length?'':'disabled'}>Crear pedido</button></form></section>`);$('checkout').onsubmit=run(async e=>{e.preventDefault();await api('/api/carrito/checkout/',Object.fromEntries(new FormData(e.target)));await ordenes()})});const cambiar=run(async id=>{await api('/api/carrito/actualizar/',{producto:id,cantidad:Number($('q'+id).value)});await carrito()});const eliminar=run(async id=>{await api('/api/carrito/eliminar/',{producto:id});await carrito()});const vaciar=run(async()=>{await api('/api/carrito/vaciar/',{});await carrito()});const ordenes=run(async()=>{if(!token)return login();let j=await api('/api/ordenes/mis-ordenes/');show('<h2>Mis pedidos</h2>'+j.map(o=>`<section style="margin-bottom:12px"><h3>Pedido #${o.id} · ${esc(o.estado)}</h3><p>${o.items.map(i=>esc(i.nombre)+' × '+i.cantidad).join(', ')}</p><p>Total S/ ${esc(o.total)} · Seguimiento: ${esc(o.numero_seguimiento||'Pendiente')}</p>${o.estado==='pendiente'?`<button onclick="cancelar(${o.id})">Cancelar pedido</button>`:''}</section>`).join(''))});const cancelar=run(async id=>{await api('/api/ordenes/'+id+'/cancelar/',{});await ordenes()});catalogo();</script></body></html>
